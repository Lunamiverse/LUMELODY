<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <!-- LUMELODY crescent emblem (Rose palette). Scalable vector; the wordmark uses it as the "O". -->
  <defs>
    <radialGradient id="pearl" cx="38%" cy="32%" r="78%"><stop offset="0" stop-color="#fff6f8"/><stop offset=".45" stop-color="#ffb3cf"/><stop offset=".75" stop-color="#c9a6ff"/><stop offset="1" stop-color="#5e3a47"/></radialGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f6dbe3" stop-opacity="0"/><stop offset=".5" stop-color="#ffd9c2"/><stop offset="1" stop-color="#f6dbe3" stop-opacity="0"/></linearGradient>
    <mask id="crescent"><rect width="100" height="100" fill="#fff"/><circle cx="63" cy="40" r="35" fill="#000"/></mask>
  </defs>
  <circle cx="50" cy="50" r="40" fill="url(#pearl)" mask="url(#crescent)"/>
  <ellipse cx="50" cy="52" rx="50" ry="11" fill="none" stroke="url(#orbit)" stroke-width="1.6" transform="rotate(-18 50 52)"/>
  <circle cx="90" cy="38" r="3.2" fill="#fff6f8"/>
</svg>
