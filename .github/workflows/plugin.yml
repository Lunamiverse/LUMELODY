name: LUMELODY plugin (VST3 / AU)

on:
  push:
    branches: [main]
    paths: ["plugin/**", "engine/**", ".github/workflows/plugin.yml"]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows (VST3), os: windows-latest, pluginval: pluginval_Windows.zip }
          - { name: macOS universal (VST3 + AU), os: macos-14, pluginval: pluginval_macOS.zip }
          - { name: Linux (tests), os: ubuntu-24.04, pluginval: pluginval_Linux.zip }
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.1-dev libgtk-3-dev \
            libglu1-mesa-dev mesa-common-dev xvfb ninja-build

      - name: WebView2 SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "$env:USERPROFILE\AppData\Local\PackageManagement\NuGet\Packages"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          nuget install Microsoft.Web.WebView2 -Version 1.0.2903.40 -OutputDirectory $dir -NonInteractive

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then GEN="-G Ninja"; else GEN=""; fi
          cmake -S plugin -B build $GEN -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Headless tests (notes, every sound, automation, save/reopen, audio export)
        shell: bash
        run: |
          T=$(find build -type f \( -name LumiTests -o -name LumiTests.exe \) -perm -u+x | head -1)
          [ -z "$T" ] && T=$(find build -type f -name 'LumiTests*' | grep -v '\.' | head -1)
          echo "running $T"
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a "$T"; else "$T"; fi

      - name: Locate plugin
        id: find
        shell: bash
        run: |
          VST3=$(find build -type d -name 'LUMELODY.vst3' -path '*VST3*' | head -1)
          echo "vst3=$VST3" >> "$GITHUB_OUTPUT"
          echo "VST3: $VST3"; ls -la "$VST3"

      - name: Sign bundles ad-hoc (macOS)
        if: runner.os == 'macOS'
        run: |
          for b in $(find build -type d \( -name 'LUMELODY.vst3' -o -name 'LUMELODY.component' -o -name 'LUMELODY.app' \)); do codesign --force --deep -s - "$b"; done
          lipo -info "${{ steps.find.outputs.vst3 }}/Contents/MacOS/LUMELODY"

      - name: pluginval (strictness 5)
        shell: bash
        run: |
          curl -sSL -o pv.zip "https://github.com/Tracktion/pluginval/releases/latest/download/${{ matrix.pluginval }}"
          unzip -q pv.zip -d pv
          if [ "$RUNNER_OS" = "macOS" ]; then PV=pv/pluginval.app/Contents/MacOS/pluginval; elif [ "$RUNNER_OS" = "Windows" ]; then PV=pv/pluginval.exe; else PV=pv/pluginval; chmod +x $PV; fi
          RUN=""; [ "$RUNNER_OS" = "Linux" ] && RUN="xvfb-run -a"
          $RUN $PV --strictness-level 5 --skip-gui-tests --validate-in-process --timeout-ms 600000 --validate "${{ steps.find.outputs.vst3 }}"

      - name: auval (macOS AU)
        if: runner.os == 'macOS'
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "$(find build -type d -name 'LUMELODY.component' | head -1)" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aumu Lmld Lmvs

      - name: Package
        if: runner.os != 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          cp -R "${{ steps.find.outputs.vst3 }}" dist/
          if [ "$RUNNER_OS" = "macOS" ]; then cp -R "$(find build -type d -name 'LUMELODY.component' | head -1)" dist/; fi
          cp plugin/INSTALL.md dist/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: runner.os != 'Linux'
        with:
          name: LUMELODY-${{ runner.os }}
          path: dist
          retention-days: 30
